services:
  web:
    build: .
    image: castiel-site:latest
    container_name: castiel-site
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
