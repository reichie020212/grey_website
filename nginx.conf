# Docker's embedded DNS — used so nginx re-resolves the `pb` service name
# at runtime (otherwise the IP is cached at startup and a pb restart breaks
# the upstream).
resolver 127.0.0.11 valid=30s ipv6=off;

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Photo uploads can run a few MB. Default of 1M would 413 the upload.
  client_max_body_size 15M;

  # ---- Compression ----
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

  # nginx's http-level `include mime.types;` already maps .html/.css/.js/etc. —
  # don't redeclare a server-level `types {}` block, it would replace the whole
  # map. Handle the missing .jsx mapping via a location block below.

  # ---- Security headers ----
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # CSP — must allow the unpkg CDN scripts (React + Babel) and Google Fonts that
  # the prototype loads from index.html. 'unsafe-eval' is required because
  # @babel/standalone compiles JSX at runtime via Function(). 'unsafe-inline'
  # for scripts is required because Babel injects the compiled JSX output as
  # inline <script> elements after fetching .jsx files. 'unsafe-inline' for
  # styles is required because some inline style attributes are set by React.
  # All three relax-keywords go away the day this project moves to a real bundler.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  # ---- PocketBase reverse proxy ----
  # /api/   → REST endpoints used by the frontend (content, photos, guestbook, auth)
  # /_/     → PocketBase admin UI (owner only — first-run creates the admin)
  # Same-origin from the browser's perspective, so connect-src 'self' covers it
  # and there's no CORS to configure.
  #
  # IMPORTANT: this block must come BEFORE the .js / static-asset regex
  # locations below. nginx evaluates regex locations in source order and the
  # first match wins — `/_/assets/index.js` would otherwise be caught by the
  # .js cache rule and served as a static file (→ 404). Keeping the proxy
  # location first ensures everything under /api/ and /_/ goes to PocketBase.
  location ~ ^/(api|_)/ {
    set $pb_upstream "http://pb:8090";
    proxy_pass $pb_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 60s;
    # PB's realtime endpoint streams SSE — disable buffering and keep the connection alive.
    proxy_buffering off;
  }

  # ---- Cache headers ----
  # index.html: never cache — owner edits and content updates land here.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    try_files $uri =404;
  }

  # .jsx has no built-in MIME — serve as application/javascript so it isn't
  # downloaded as octet-stream. (Babel fetches via XHR so the type isn't strictly
  # required, but the right header keeps DevTools and proxies happy.)
  # `no-cache` means "browser may store, must revalidate every time" — combined
  # with nginx's automatic ETag, this gives 304s when unchanged but immediately
  # picks up `git pull && docker compose up --build` deploys (filenames aren't
  # content-hashed in this no-build prototype).
  location ~* \.(?:jsx|css)$ {
    default_type application/javascript;
    add_header Cache-Control "no-cache" always;
  }

  # Image / font / static-bytes assets are content-stable — short revalidate window.
  location ~* \.(?:js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=3600" always;
  }

  # Silence the favicon.ico 404 noise — there is no favicon in the prototype yet.
  location = /favicon.ico {
    access_log off;
    log_not_found off;
    return 204;
  }

  # SPA fallback — there is no client-side router today, but this future-proofs
  # the deploy and keeps deep links from 404'ing if a router is added later.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hide nginx version in error responses.
  server_tokens off;
}
